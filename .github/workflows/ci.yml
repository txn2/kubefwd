name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Every job reads the Go version from go.mod's toolchain directive, the same
# pin `make check-go-version` enforces locally. Scanner and tool versions live
# in the Makefile; jobs call make targets so local and CI run the same tools.

jobs:
  validate-actions:
    name: Validate Action SHAs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate GitHub Action SHA pins
        run: ./scripts/validate-action-shas.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so --new-from-rev below can diff against the base
          # commit. A shallow clone has no base to diff against.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The base is the PR's target commit on pull_request and the previous
      # tip on push. github.event.before is all zeros when there is no
      # previous tip, so fall back to the parent commit.
      - name: Resolve lint base
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD~1)
          fi
          echo "Lint base: $base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # GOLANGCI_LINT_VERSION in the Makefile; `make tools-check` fails if
          # the two differ.
          version: v2.12.1
          # Only issues on changed lines fail the build, so pre-existing issues
          # don't block stricter linters (#621). This uses golangci-lint's
          # git-based --new-from-rev, not the action's only-new-issues: that
          # option fetches the diff from the GitHub API, fails on diffs over
          # 20,000 lines and then falls back to linting the whole repo. The
          # git-based diff has no size limit and matches `make lint`.
          args: --new-from-rev=${{ steps.base.outputs.sha }}

      # Formatting is checked over the whole tree, not only changed lines.
      - name: Check formatting
        run: make fmt-check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the patch-coverage merge base.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Coverage floor
        if: matrix.os == 'ubuntu-latest'
        run: make coverage-check

      - name: Patch coverage
        if: matrix.os == 'ubuntu-latest'
        run: make patch-coverage

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          fail_ci_if_error: false
          verbose: true

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run fuzz tests
        run: |
          # Run each fuzz test for 30 seconds with 60s total timeout for setup/teardown
          echo "Running FuzzIpFromString..."
          go test -fuzz=FuzzIpFromString -fuzztime=30s -timeout=60s ./pkg/fwdip/...
          echo "Running FuzzServiceConfigurationFromReservation..."
          go test -fuzz=FuzzServiceConfigurationFromReservation -fuzztime=30s -timeout=60s ./pkg/fwdip/...

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the semgrep-diff merge base.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # gosec, govulncheck judged against .govulncheck-allow.txt (both
      # modules), and osv-scanner judged against osv-scanner.toml.
      - name: gosec, govulncheck, osv-scanner
        run: make security

      - name: Semgrep (p/golang)
        run: make semgrep

      - name: Semgrep (changed lines)
        run: make semgrep-diff

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check go.mod and go.sum are tidy
        run: make tidy-check

      - name: Build
        run: go build -o kubefwd ./cmd/kubefwd/kubefwd.go

      - name: Verify version output
        run: ./kubefwd version

      - name: Verify goreleaser config
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2.13"
          args: check
