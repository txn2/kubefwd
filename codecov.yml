coverage:
  status:
    project:
      default:
        # COVERAGE_MIN in the Makefile; `make coverage-check` enforces the
        # same floor locally and in CI.
        target: 80%
        threshold: 2%
    patch:
      default:
        # PATCH_COVERAGE_MIN in the Makefile; `make patch-coverage` enforces
        # it locally and in CI. Code that only runs as root or against a live
        # cluster is made testable by injecting its OS calls (see
        # pkg/fwdapi/network.go) rather than exempted from the gate.
        target: 80%
        threshold: 5%
        informational: false

ignore:
  - "**/*_test.go"
  - "**/testdata/**"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
