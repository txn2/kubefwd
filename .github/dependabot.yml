version: 2
updates:
  # Go modules. Minor and patch updates arrive as one grouped PR per run;
  # majors stay separate because they can break the build.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "go"
    groups:
      k8s:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
        update-types: ["minor", "patch"]
      go-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
        update-types: ["minor", "patch"]

  # Integration test module
  - package-ecosystem: "gomod"
    directory: "/test/integration"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "go"
    groups:
      integration:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"

  # Docs site (mkdocs) requirements
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docs"
    labels:
      - "dependencies"
      - "python"
    groups:
      docs:
        patterns:
          - "*"
